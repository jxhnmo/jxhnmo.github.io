# Four high-severity advisories (nanoid, fast-uri, js-yaml, sharp via libvips)
# piled up here before anyone looked. Three of them were fixed in versions the
# existing ranges already allowed — the lockfile was just stale. sharp was not:
# it is an optional dependency of next, and next 16.2 pinned it to ^0.34.5, so
# reaching the patched 0.35.3 meant moving next itself to 16.3. Weekly update
# PRs surface both kinds before they pile up.
#
# Grouped into one PR per ecosystem run: every dependency here is transitive or
# dev tooling, so reviewing them together beats a PR per package. `npm run
# check` is the gate — it typechecks, lints, and does a full static build.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
