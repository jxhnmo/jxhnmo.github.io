# Four high-severity advisories (nanoid, fast-uri, js-yaml, sharp via libvips)
# piled up here before anyone looked. Three of them were fixed in versions the
# existing ranges already allowed — the lockfile was just stale. sharp was not:
# it is an optional dependency of next, and next 16.2 pinned it to ^0.34.5, so
# reaching the patched 0.35.3 meant moving next itself to 16.3.
#
# Weekly updates here only surface the sharp kind. Version updates open PRs for
# what package.json declares, and `dependency-type: indirect` is unsupported for
# npm, so the three lockfile-stale transitive ones produce no PR at all until a
# direct parent publishes. .github/workflows/audit.yml is the other half: it runs
# `npm audit` against the lockfile on this same cadence, which does catch those.
#
# Grouped one PR per ecosystem, but split on update-types. Everything here is
# transitive or dev tooling, so minors and patches are worth reviewing together;
# a major in that same PR is not, because the whole group then waits on whichever
# single bump broke the build. The first group PR this config opened bundled
# eslint 9→10, typescript 5→7 and @types/node 22→26 in with ten patch bumps —
# that is the shape being split. Security updates stay ungrouped: `applies-to`
# defaults to version updates, so an advisory still arrives as its own PR.
#
# .github/workflows/check.yml is the gate on all of them — it verifies asset
# freshness, then format, typecheck, lint, and a full static build, and audits
# the lockfile the PR proposes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
  # Those two workflows pin action majors, which is a second ecosystem that would
  # otherwise go stale the same way this file exists to prevent. Split the same
  # way: an action major is the one that changes runner behaviour under you.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
